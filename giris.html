<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONEO - Giriş</title>
<style>
:root{--bg:#0b1020;--kart:#141b33;--yazi:#e8ecf8;--soluk:#8b95b5;--vurgu:#3b82f6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#18224a,var(--bg));color:var(--yazi);font-family:system-ui,Segoe UI,sans-serif}
.kutu{width:min(380px,92vw);background:var(--kart);border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{margin:0;text-align:center;letter-spacing:6px;font-size:34px}
.alt{text-align:center;color:var(--soluk);font-size:13px;margin:4px 0 20px}
.sek{display:flex;gap:6px;margin-bottom:16px}
.sek button{flex:1;padding:9px;border:0;border-radius:8px;background:#1d2647;color:var(--soluk);cursor:pointer;font-size:14px}
.sek button.ak{background:var(--vurgu);color:#fff}
label{display:block;font-size:12px;color:var(--soluk);margin:12px 0 4px}
input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #2a3560;background:#0f1530;color:var(--yazi);font-size:15px}
input:focus{outline:2px solid var(--vurgu);border-color:transparent}
.renk{display:flex;gap:8px;margin-top:4px}
.renk span{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.renk span.ak{border-color:#fff}
.git{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--vurgu);color:#fff;font-size:16px;cursor:pointer}
.git:disabled{opacity:.6}
.msj{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:#fca5a5}
.msj.ok{color:#86efac}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:36px;font-weight:700}
.gizli{display:none}
</style></head><body>
<div class="kutu">
  <h1>ONEO</h1><div class="alt">OyuN Eğlence Merkezi</div>

  <div id="girisEkran">
    <div class="sek"><button id="tGiris" class="ak">Giriş Yap</button><button id="tKayit">Hesap Aç</button></div>
    <label>Kullanıcı adı</label><input id="kad" autocomplete="username" maxlength="16" placeholder="örn. oyuncu1">
    <label>Şifre</label><input id="sif" type="password" autocomplete="current-password" placeholder="en az 6 karakter">
    <div id="avBlok" class="gizli"><label>Profil rengi</label><div class="renk" id="renkler"></div></div>
    <button class="git" id="git">Giriş Yap</button>
    <div class="msj" id="msj"></div>
  </div>

  <div id="hosEkran" class="gizli">
    <div class="avatar" id="av"></div>
    <div style="text-align:center;font-size:20px" id="hosAd"></div>
    <div style="text-align:center;color:var(--soluk);margin-top:4px" id="hosPuan"></div>
    <button class="git" id="oyna">Oyunlara Gir</button>
    <button class="git" id="cik" style="background:#1d2647">Çıkış Yap</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === BURAYI DOLDUR (Supabase > Project Settings > API) ===
const SUPABASE_URL = "BURAYA_PROJECT_URL";
const SUPABASE_KEY = "BURAYA_ANON_PUBLIC_KEY";
const OYUN_SAYFASI = "ONEO.html";
// =========================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const RENKLER = ["#3b82f6","#ef4444","#22c55e","#f59e0b","#a855f7","#14b8a6"];
let kayitModu = false, renk = RENKLER[0];

RENKLER.forEach(c => { const s = document.createElement("span"); s.style.background = c; if(c === renk) s.className = "ak";
  s.onclick = () => { renk = c; [...$("renkler").children].forEach(e => e.className = ""); s.className = "ak"; };
  $("renkler").appendChild(s); });

function mod(k){ kayitModu = k; $("tGiris").className = k ? "" : "ak"; $("tKayit").className = k ? "ak" : "";
  $("avBlok").className = k ? "" : "gizli"; $("git").textContent = k ? "Hesap Aç" : "Giriş Yap"; $("msj").textContent = ""; }
$("tGiris").onclick = () => mod(false); $("tKayit").onclick = () => mod(true);

const eposta = k => k.trim().toLowerCase() + "@oneo.game";
function msj(t, ok){ $("msj").textContent = t; $("msj").className = "msj" + (ok ? " ok" : ""); }

async function hosGoster(user){
  const { data } = await sb.from("profiller").select("*").eq("id", user.id).single();
  $("girisEkran").className = "gizli"; $("hosEkran").className = "";
  const ad = data ? data.kullanici : "Oyuncu";
  $("av").style.background = data ? data.avatar : RENKLER[0]; $("av").textContent = ad[0].toUpperCase();
  $("hosAd").textContent = "Hoş geldin, " + ad; $("hosPuan").textContent = "Puan: " + (data ? data.puan : 0);
}

$("git").onclick = async () => {
  const k = $("kad").value.trim(), s = $("sif").value;
  if(!/^[a-zA-Z0-9_]{3,16}$/.test(k)) return msj("Kullanıcı adı 3-16 harf/rakam/_ olmalı");
  if(s.length < 6) return msj("Şifre en az 6 karakter olmalı");
  $("git").disabled = true; msj("Bekle...", true);
  try{
    if(kayitModu){
      const { data, error } = await sb.auth.signUp({ email: eposta(k), password: s });
      if(error) throw error;
      const { error: e2 } = await sb.from("profiller").insert({ id: data.user.id, kullanici: k, avatar: renk });
      if(e2) throw e2;
      await hosGoster(data.user);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email: eposta(k), password: s });
      if(error) throw error;
      await hosGoster(data.user);
    }
  }catch(e){
    const t = String(e.message || e);
    msj(/already|duplicate/i.test(t) ? "Bu kullanıcı adı alınmış" : /invalid login/i.test(t) ? "Kullanıcı adı veya şifre yanlış" : t);
  }
  $("git").disabled = false;
};
$("oyna").onclick = () => location.href = OYUN_SAYFASI;
$("cik").onclick = async () => { await sb.auth.signOut(); location.reload(); };
sb.auth.getSession().then(({ data }) => { if(data.session) hosGoster(data.session.user); });
</script></body></html>
