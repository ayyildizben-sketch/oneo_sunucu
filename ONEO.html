// =====================================================================
//  KAYIT
// =====================================================================
const KEY = "kartliPS_oyunlar";
let oyunlar = [];
let atamaBekleyen = null;   // kart atanmayı bekleyen oyun indexi
let acikYol = null;         // şu an ekranda açık olan oyun
let tamDenendi = false;
let kapatT = null;

function yukle(){
  try { oyunlar = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ oyunlar = []; }
  if(!Array.isArray(oyunlar)) oyunlar = [];
  // Eski "games/xxx.html" kayıtlarını gömülü oyunlara çevir (kart atamaları korunur)
  oyunlar.forEach(o=>{
    if(typeof o.yol === "string" && !o.yol.startsWith("gomulu:")){
      const m = o.yol.match(/([^\/\\]+)\.html?$/i);
      if(m && GOMULU[m[1].toLowerCase()]) o.yol = "gomulu:" + m[1].toLowerCase();
    }
  });
  // Eksik gömülü oyunları ekle
  VARSAYILAN.forEach(k=>{
    if(!oyunlar.some(o=>o.yol === "gomulu:"+k)) oyunlar.push({ad:GOMULU[k].ad, yol:"gomulu:"+k, uid:""});
  });
  kaydet();
}
function kaydet(){ try{ localStorage.setItem(KEY, JSON.stringify(oyunlar)); }catch(e){} }

// =====================================================================
//  ARAYÜZ
// =====================================================================
function ciz(){
  const l = document.getElementById("liste");
  l.innerHTML = "";
  oyunlar.forEach((o,i)=>{
    const d = document.createElement("div");
    d.className = "oyun" + (atamaBekleyen===i ? " bekliyor":"");
    const g = o.yol.startsWith("gomulu:") ? GOMULU[o.yol.slice(7)] : null;
    if(g) d.style.setProperty("--ac", g.renk);
    d.innerHTML = `<h3><span class="ik"></span><span class="ad"></span></h3><div class="ip"></div><div class="uid ${o.uid?'var':''}"></div><div class="satir"></div>`;
    d.querySelector(".ik").textContent = g ? g.ikon : "🎮";
    d.querySelector(".ad").textContent = o.ad;
    d.querySelector(".ip").textContent = g ? g.ipucu : o.yol;
    d.querySelector(".uid").textContent = atamaBekleyen===i ? "⏳ Kartı okut..." : (o.uid ? "Kart: "+o.uid : "Kart atanmadı");
    const s = d.querySelector(".satir");
    s.append(btn("▶ Aç", ()=>ac(o)));
    s.append(btn("💳 Kart ata", ()=>{ atamaBekleyen = i; ciz(); }));
    if(!o.yol.startsWith("gomulu:")){
      s.append(btn("✏️ Yol", ()=>{
        const y = prompt("Oyun dosyasının yolu:", o.yol);
        if(y && y.trim()){ o.yol = y.trim(); kaydet(); ciz(); }
      }));
    }
    s.append(btn("🗑", ()=>{
      if(confirm(o.ad+" silinsin mi?")){ oyunlar.splice(i,1); atamaBekleyen=null; kaydet(); ciz(); }
    }));
    l.appendChild(d);
  });
}
function btn(t,f){ const b=document.createElement("button"); b.textContent=t; b.onclick=f; return b; }

// =====================================================================
//  OYUN AÇ / KAPAT / TAM EKRAN
// =====================================================================
function odak(){ try{ document.getElementById("cerceve").contentWindow.focus(); }catch(e){} }
function tamEkranDene(){ /* otomatik tam ekran kapalı: ⛶ düğmesi ya da F11 */ }
function ac(o){
  const ekran = document.getElementById("oyunEkrani");
  const f = document.getElementById("cerceve");
  // Aynı oyun zaten açıksa yeniden yükleme (kart sürekli okunuyorsa oyun sıfırlanmasın)
  if(ekran.style.display === "block" && !kapatT && acikYol === o.yol) return;
  if(kapatT){ clearTimeout(kapatT); kapatT = null; ekran.classList.remove("kapaniyor"); }

  f.onload = ()=>{
    try{
      const w = f.contentWindow;
      w.focus();   // kart okutunca tuşlar direkt oyuna gitsin
      w.document.addEventListener("keydown", onayTus);
    }catch(e){}
  };
  if(o.yol.startsWith("gomulu:")){
    const k = o.yol.slice(7);
    if(!GOMULU[k]){ alert("Gömülü oyun bulunamadı: " + o.yol); return; }
    f.removeAttribute("src");
    f.srcdoc = oyunHtml(k);
  } else {
    f.removeAttribute("srcdoc");
    f.src = o.yol;
  }
  acikYol = o.yol;
  ekran.style.display = "block";
  void ekran.offsetWidth;            // animasyonun başlaması için
  ekran.classList.add("acik");
  SFX.ac();
  tamDenendi = false;
  tamEkranDene();
}
function kapat(){
  const ekran = document.getElementById("oyunEkrani");
  if(ekran.style.display !== "block" || kapatT) return;
  SFX.muzikDur(); SFX.play("kapat");
  ekran.classList.remove("acik"); ekran.classList.add("kapaniyor");
  acikYol = null;
  if(document.fullscreenElement){ try{ document.exitFullscreen().catch(function(){}); }catch(e){} }
  kapatT = setTimeout(function(){
    kapatT = null;
    ekran.style.display = "none"; ekran.classList.remove("kapaniyor");
    const f = document.getElementById("cerceve");
    f.onload = null; f.removeAttribute("srcdoc"); f.src = "about:blank";
  }, 520);
}
document.getElementById("cikis").onclick = kapat;
// ---- Esc: doğrudan çıkma yok, onay iste (Blokcraft kendi duraklatma menüsünü kullanır) ----
const onay=document.createElement("div");
onay.style.cssText="position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62)";
onay.innerHTML='<div style="background:#161c2e;border:1px solid #2b3552;border-radius:14px;padding:26px 36px;text-align:center;max-width:90vw"><h2 style="margin:0 0 6px">Bu oyundan çıkıyorsunuz</h2><p style="color:#9ca3af;margin:0 0 18px">Kaydedilmemiş ilerleme kaybolur.</p><button class="primary" id="onayEvet">Çık (Enter)</button> <button id="onayHayir">Devam et (Esc)</button></div>';
document.getElementById("oyunEkrani").appendChild(onay);
function modernAcik(){ return !!(acikYol && acikYol.startsWith("gomulu:") && (GOMULU[acikYol.slice(7)]||{}).modern); }
function onayKapat(){ onay.style.display="none"; odak(); }
function onayTus(e){
  if(onay.style.display!=="flex"){ if(e.key==="Escape" && acikYol && !modernAcik()){ e.preventDefault(); onay.style.display="flex"; document.getElementById("onayHayir").focus(); } return; }
  if(e.key==="Escape"||e.key==="n"||e.key==="N"){ e.preventDefault(); onayKapat(); }
  else if(e.key==="Enter"||e.key==="y"||e.key==="Y"||e.key==="e"||e.key==="E"){ e.preventDefault(); onayKapat(); kapat(); }
}
document.getElementById("onayEvet").onclick=()=>{ onayKapat(); kapat(); };
document.getElementById("onayHayir").onclick=onayKapat;
document.getElementById("tamBtn").onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.getElementById("oyunEkrani").requestFullscreen().catch(()=>{});
  setTimeout(odak, 100);
};
document.addEventListener("keydown", onayTus);

// ---- ses düğmeleri ----
function sesGuncelle(){
  const d = SFX.durum();
  const ik = d.sessiz ? "🔇" : "🔊";
  document.getElementById("sesBtn").textContent = ik;
  document.getElementById("sesBtn2").textContent = ik;
  document.getElementById("sesKay").value = Math.round(d.vol*100);
}
function sesDegis(){ SFX.sessizDegis(); sesGuncelle(); odak(); }
document.getElementById("sesBtn").onclick = sesDegis;
document.getElementById("sesBtn2").onclick = sesDegis;
document.getElementById("sesKay").oninput = e=>{ SFX.sesAyar(e.target.value/100); };
document.getElementById("sesDene").onclick = ()=>{
  SFX.ac(); SFX.play("acilis");
  setTimeout(()=>SFX.play("coin"), 900); setTimeout(()=>SFX.play("jump"), 1150);
  setTimeout(()=>SFX.play("win"), 1500); setTimeout(()=>SFX.play("death"), 3000);
};
sesGuncelle();

// =====================================================================
//  KART GELDİ
// =====================================================================
// "UID:A1B2C3D4", "Kart ID: A1 B2 C3 D4", "a1:b2:c3:d4" hepsi olur
function idCikar(satir){
  const s = satir.replace(/0x/gi," ").replace(/\s+/g," ");
  const m = s.match(/(?:UID|ID|KART|CARD|TAG)[\s:=#\-]{0,6}((?:[0-9A-Fa-f]{2}[\s:\-]?){3,})/i)
         || s.match(/((?:[0-9A-Fa-f]{2}[\s:\-]){3,}[0-9A-Fa-f]{2})/)
         || s.match(/\b([0-9A-Fa-f]{8,20})\b/);
  return m ? idNorm(m[1]) : null;
}
function idNorm(s){ return (s||"").replace(/[^0-9A-Za-z]/g,"").toUpperCase(); }

function kartGeldi(uid){
  uid = idNorm(uid);
  if(!uid) return;
  document.getElementById("sonKart").textContent = "Son kart: " + uid;
  if(atamaBekleyen !== null){
    oyunlar.forEach(o=>{ if(idNorm(o.uid)===uid) o.uid=""; });   // aynı kart başka oyundaysa boşalt
    oyunlar[atamaBekleyen].uid = uid;
    atamaBekleyen = null;
    kaydet(); ciz();
    return;
  }
  const o = oyunlar.find(x=>x.uid && idNorm(x.uid)===uid);
  if(o) ac(o);
  else document.getElementById("sonKart").textContent = "Tanımsız kart: " + uid;
}

// =====================================================================
//  WEB SERIAL
// =====================================================================
let port;
async function baglan(){
  SFX.ac();
  if(!("serial" in navigator)){ alert("Bu tarayıcı Web Serial desteklemiyor. Chrome veya Edge kullan."); return; }
  try{
    port = await navigator.serial.requestPort();
    await portAc();
  }catch(e){ hataGoster(e); }
}
async function portAc(){
  await port.open({baudRate:9600});
  const d = document.getElementById("durum");
  d.textContent = "Bağlı ✓"; d.classList.add("bagli");
  dinle().catch(e=>{ baglantiKoptu(e); });
}
function baglantiKoptu(e){
  const d = document.getElementById("durum");
  d.textContent = "Bağlantı koptu — tekrar bağlan"; d.classList.remove("bagli");
  console.error(e);
}
function hataGoster(e){
  console.error(e);
  const d = document.getElementById("durum");
  d.classList.remove("bagli");
  if(e && e.name==="NotFoundError") d.textContent = "Port seçilmedi";
  else if(e && e.name==="InvalidStateError") d.textContent = "Port zaten açık (başka sekme?)";
  else d.textContent = "Port açılamadı: Serial Monitor / başka sekme / başka program açık olabilir";
}
async function otoBaglan(){
  if(!("serial" in navigator)) return;
  try{
    const ports = await navigator.serial.getPorts();
    if(ports.length){ port = ports[0]; await portAc(); }
  }catch(e){ hataGoster(e); }
}
async function dinle(){
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable).catch(()=>{});
  const reader = dec.readable.getReader();
  let tampon = "", zm = null;
  function isle(satir){
    satir = satir.trim(); if(!satir) return;
    document.getElementById("ham").textContent = "Gelen veri: " + satir;
    const id = idCikar(satir); if(id) kartGeldi(id);
  }
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    tampon += value; clearTimeout(zm);
    let n; while((n = tampon.search(/[\r\n]/)) >= 0){ isle(tampon.slice(0,n)); tampon = tampon.slice(n+1); }
    if(tampon.trim()) zm = setTimeout(()=>{ isle(tampon); tampon = ""; }, 150);
  }
  baglantiKoptu("port kapandı");
}

// =====================================================================
//  OLAYLAR
// =====================================================================
document.getElementById("baglan").onclick = baglan;
document.getElementById("ekle").onclick = ()=>{
  const ad = document.getElementById("yeniAd").value.trim();
  const yol = document.getElementById("yeniYol").value.trim();
  if(!ad || !yol) return;
  oyunlar.push({ad, yol, uid:""});
  kaydet(); ciz();
  document.getElementById("yeniAd").value = document.getElementById("yeniYol").value = "";
};
document.getElementById("testGonder").onclick = ()=>kartGeldi(document.getElementById("testUid").value);

if(navigator.serial) navigator.serial.addEventListener("connect", ()=>{ if(!(port && port.readable)) otoBaglan(); });
yukle(); ciz(); otoBaglan();
